<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChatGPT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #202123;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 260px;
            background: #f7f7f8;
            padding: 12px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ececec;
        }

        .brand {
            font-size: 18px;
            font-weight: 600;
            padding: 12px;
            margin-bottom: 10px;
        }

        .new-chat {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: transparent;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
        }

        .new-chat:hover {
            background: #ececec;
        }

        .sidebar-bottom {
            margin-top: auto;
            font-size: 12px;
            color: #777;
            padding: 12px;
        }

        /* MAIN CHAT */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .topbar {
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-weight: 600;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 150px;
        }

        .welcome {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .welcome h1 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        /* MESSAGES */

        .message {
            max-width: 760px;
            margin: 0 auto 30px;
            line-height: 1.6;
            font-size: 16px;
        }

        .user-message {
            display: flex;
            justify-content: flex-end;
        }

        .user-bubble {
            background: #f4f4f4;
            padding: 10px 16px;
            border-radius: 20px;
            max-width: 70%;
        }

        .assistant-message {
            display: flex;
            gap: 12px;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        /* COMPOSER */

        .composer-wrap {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;

            padding: 20px 20px 25px;

            background:
                linear-gradient(
                    transparent,
                    white 35%
                );
        }

        .composer {
            max-width: 760px;
            margin: auto;

            background: #f4f4f4;

            border-radius: 26px;

            padding: 10px 12px 10px 18px;

            display: flex;
            align-items: center;
            gap: 10px;
        }

        #prompt {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            padding: 8px 0;
        }

        #send {
            width: 36px;
            height: 36px;

            border: none;
            border-radius: 50%;

            background: #111;
            color: white;

            font-size: 18px;

            cursor: pointer;
        }

        #send:disabled {
            opacity: 0.4;
        }

        .disclaimer {
            text-align: center;
            font-size: 11px;
            color: #888;
            margin-top: 10px;
        }

        /* THINKING ANIMATION */

        .thinking {
            display: inline-flex;
            gap: 5px;
            padding-top: 7px;
        }

        .thinking span {
            width: 7px;
            height: 7px;

            background: #777;
            border-radius: 50%;

            animation: bounce 1.2s infinite;
        }

        .thinking span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .thinking span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            40% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .sidebar {
                display: none;
            }

            .topbar {
                padding-left: 15px;
            }

            .chat {
                padding-left: 15px;
                padding-right: 15px;
            }

            .composer-wrap {
                padding: 10px;
            }

            .welcome h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="brand">
            CFatGPT
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New chat
        </button>

        <div class="sidebar-bottom">
            ChatGPT
        </div>

    </aside>


    <!-- Main -->
    <main class="main">

        <div class="topbar">
            ChatGPT
        </div>


        <div class="chat" id="chat">

            <div class="welcome" id="welcome">

                <h1>What can I help with?</h1>

            </div>

        </div>


        <!-- Composer -->
        <div class="composer-wrap">

            <div class="composer">

                <input
                    id="prompt"
                    type="text"
                    placeholder="Ask anything"
                    autocomplete="off"
                >

                <button id="send">
                    ↑
                </button>

            </div>

            <div class="disclaimer">
                CFatGPT is a parody website and is not affiliated with OpenAI.
            </div>

        </div>

    </main>

</div>


<script>

const promptInput = document.getElementById("prompt");
const sendButton = document.getElementById("send");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");


function sendMessage() {

    const text = promptInput.value.trim();

    if (!text) return;


    /* Remove welcome screen */

    if (welcome) {
        welcome.style.display = "none";
    }


    /* User message */

    const userMessage = document.createElement("div");

    userMessage.className = "message user-message";

    userMessage.innerHTML = `
        <div class="user-bubble"></div>
    `;

    userMessage.querySelector(".user-bubble").textContent = text;

    chat.appendChild(userMessage);


    promptInput.value = "";
    promptInput.disabled = true;
    sendButton.disabled = true;


    /* Fake AI response */

    const assistant = document.createElement("div");

    assistant.className = "message assistant-message";

    assistant.innerHTML = `

        <div class="avatar">
            CF
        </div>

        <div class="response">

            <div class="thinking">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    `;

    chat.appendChild(assistant);

    chat.scrollTop = chat.scrollHeight;


    /* Wait 10 seconds */

    setTimeout(() => {

        const response =
            assistant.querySelector(".response");

        response.innerHTML = `
            <strong>YOU ARE GAY</strong>
        `;

        promptInput.disabled = false;
        sendButton.disabled = false;

        promptInput.focus();

        chat.scrollTop = chat.scrollHeight;

    }, 10000);

}


sendButton.addEventListener(
    "click",
    sendMessage
);


promptInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }
);


function newChat() {

    chat.innerHTML = `

        <div class="welcome" id="welcome">

            <h1>
                What can I help with?
            </h1>

        </div>
    `;

    promptInput.value = "";
    promptInput.disabled = false;
    sendButton.disabled = false;

}

</script>

</html>
